name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --lib --tests --examples
      - name: Test (debug)
        run: cargo test --lib
      - name: Test (release)
        run: cargo test --lib --release
      - name: Stress (release)
        run: cargo test --lib --release test_soak_randomized_stream_lifecycles -- --ignored
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --lib --tests --examples --all-features -- -D warnings

  go-interop:
    name: Interoperability with Go smux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tests/go-interop/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test against github.com/xtaci/smux
        run: cargo test --test go_interop -- --ignored
